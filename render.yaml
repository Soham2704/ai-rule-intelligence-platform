services:
  # Main API Service
  - type: web
    name: ai-rule-api
    env: python
    plan: free
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  # API Bridge Service
  - type: web
    name: ai-rule-bridge
    env: python
    plan: free
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "python -m uvicorn api_bridge:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MAIN_API_URL
        value: "https://ai-rule-api.onrender.com"

  # Streamlit UI Service
  - type: web
    name: ai-rule-ui
    env: python
    plan: free
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "python -m streamlit run design_platform_ui.py --server.port=$PORT --server.address=0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MAIN_API_URL
        value: "https://ai-rule-api.onrender.com"
      - key: BRIDGE_API_URL
        value: "https://ai-rule-bridge.onrender.com/api/design-bridge"